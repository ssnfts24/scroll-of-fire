[build]
  publish = "docs"

# Static HTML site — no build step. Netlify serves the files in docs/ directly.

# The Codex Guide's talking rung (Rung 3) — the site's only function.
# It lives on this host only; the GitHub Pages mirror serves the
# record-only Guide, as the mirror split declares. The function's
# corpus is the site's own record: the Living Search shards, the
# Claim Register, and the modules that read them, carried into the
# function bundle so the record it speaks from is the record in this
# repo. The provider key is set by Aaron in this host's environment
# settings (GUIDE_API_KEY) — never in this repo.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]
  included_files = [
    "docs/assets/search/**",
    "docs/scroll/evidence/claim-register.json",
    "docs/assets/js/living-search-core.js",
    "docs/assets/js/codex-guide.js",
    "docs/assets/js/calendar/**",
    "netlify/functions/lib/codex-guide-rulebook.md"
  ]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://stats.g.doubleclick.net https://api.open-meteo.com https://geocoding-api.open-meteo.com https://archive-api.open-meteo.com https://historical-forecast-api.open-meteo.com https://air-quality-api.open-meteo.com https://services.swpc.noaa.gov; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Source filenames are intentionally stable, so every deploy must revalidate.
    # The service worker supplies the offline copy after the network check.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
